name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run hash
      - run: npm run release:package
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            build/sealedcash_privacy.json
            build/artifact-manifest.json
            release/sealedcash-circuits-release.json